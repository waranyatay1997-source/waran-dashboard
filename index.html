<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waran Tools Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F2440; --black: #07090D; --charcoal: #2B3038; --slate: #5A6270; --silver: #C9CED6; --white: #FFFFFF;
    --amber: #E0953F; --steel: #4C7A9C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; color: var(--navy);
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--black) 0%, var(--navy) 22%, var(--charcoal) 42%, var(--slate) 60%, var(--silver) 82%, var(--white) 100%);
    background-attachment: fixed;
  }
  button { font-family: inherit; }

  /* ---------- full-width portal bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 24px; flex-shrink: 0;
    background: rgba(7,9,13,.88); border-bottom: 1px solid rgba(255,255,255,.08); color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 6px; background: var(--amber); color: var(--navy);
    font-weight: 700; font-size: 12px; display: grid; place-items: center;
  }
  .brand b { font-size: 14px; letter-spacing: .08em; }
  .brand small { font-size: 12px; color: #9AA3B2; letter-spacing: .12em; margin-left: 6px; }
  .home-btn {
    margin-left: 8px; width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); color: #fff; display: grid; place-items: center; cursor: pointer; text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .home-btn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); }
  .home-btn svg { width: 18px; height: 18px; }
  .bar-title { font-size: 14px; color: #D5DBE4; margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-title:empty { display: none; }
  .spacer { flex: 1; }
  .open-new { font-size: 12.5px; color: #D5DBE4; text-decoration: none; white-space: nowrap; }
  .open-new:hover { color: #fff; }
  .open-new:empty { display: none; }
  .status { font-size: 12px; color: #9AA3B2; white-space: nowrap; }

  /* ---------- home ---------- */
  .home { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 56px 24px 60px; overflow-y: auto; }
  .home.hide { display: none; }
  .panel {
    width: 100%; max-width: 920px; background: rgba(255,255,255,.94); border-radius: 14px; padding: 34px 36px 30px;
    box-shadow: 0 24px 60px rgba(7,9,13,.35);
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; }
  .panel-head h1 { margin: 0; font-size: 18px; font-weight: 600; color: var(--navy); }
  .panel-head span { font-size: 12px; color: var(--slate); }

  .apps {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 26px 16px;
  }
  .app {
    all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 10px 6px; border-radius: 10px; text-align: center; outline-offset: 3px;
  }
  .app:focus-visible { outline: 2px solid var(--steel); }
  .app-ic {
    width: 58px; height: 58px; border-radius: 12px; background: var(--navy); color: #fff;
    display: grid; place-items: center; box-shadow: 0 4px 12px rgba(7,9,13,.18);
    transition: transform .15s, background .15s;
  }
  .app-ic svg { width: 26px; height: 26px; }
  .app:hover .app-ic { transform: translateY(-2px); background: var(--steel); }
  .app-name { font-size: 12.5px; font-weight: 500; color: var(--navy); line-height: 1.35; max-width: 120px; }
  .app-tag { font-size: 10.5px; color: var(--slate); }
  .empty { text-align: center; color: var(--slate); font-size: 13px; padding: 30px 0; }
  .empty.hide { display: none; }

  /* ---------- tool view ---------- */
  .tool-view { flex: 1; display: none; min-height: 0; }
  .tool-view.show { display: flex; flex-direction: column; }
  .tool-frame { flex: 1; width: 100%; border: 0; background: #F3F4F6; min-height: 0; }

  @media (max-width: 640px) {
    .bar { padding: 0 14px; gap: 10px; }
    .brand small { display: none; }
    .status { display: none; }
    .home { padding: 24px 12px 40px; }
    .panel { padding: 22px 18px; }
    .apps { grid-template-columns: repeat(3, 1fr); gap: 20px 10px; }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="#"><span class="brand-mark">WR</span><b>WARAN</b><small>TOOLS PORTAL</small></a>
  <a class="home-btn" id="homeBtn" href="#" title="Home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
  </a>
  <span class="bar-title" id="barTitle"></span>
  <span class="spacer"></span>
  <a class="open-new" id="openNew" target="_blank" rel="noopener">Open in new tab ↗</a>
  <span class="status">Browser-only processing</span>
</header>

<main class="home" id="view-home">
  <div class="panel">
    <div class="panel-head"><h1>Applications</h1><span id="count"></span></div>
    <div class="apps" id="apps"></div>
    <p class="empty hide" id="empty">No applications yet.</p>
  </div>
</main>

<section class="tool-view" id="view-tool">
  <iframe class="tool-frame" id="toolFrame" title="Tool" allow="clipboard-read; clipboard-write; file-system-access"></iframe>
</section>

<script>
  // To add a future application, append one entry here.
  const APPS = [
    { id: "pdf-merge", title: "Completed set - 0409", tag: "Browser", file: "tools/pdf-merge.html",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg>' },
    { id: "ocr", title: "Pallet Label OCR", tag: "Claude API", file: "tools/ocr.html",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>' },
    { id: "wd-billing", title: "WD Warehouse Billing", tag: "Folder", file: "tools/wd-billing.html",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></svg>' },
    { id: "invoice-merger", title: "Invoice - Opmobility", tag: "Browser", file: "tools/invoice-merger.html",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>' }
  ];

  const appsEl = document.getElementById("apps");
  const home = document.getElementById("view-home");
  const view = document.getElementById("view-tool");
  const frame = document.getElementById("toolFrame");
  const barTitle = document.getElementById("barTitle");
  const openNew = document.getElementById("openNew");

  document.getElementById("count").textContent = APPS.length + " application" + (APPS.length === 1 ? "" : "s");
  appsEl.innerHTML = APPS.map(a => `
    <a class="app" href="#${a.id}" title="${a.title}">
      <span class="app-ic">${a.icon}</span>
      <span class="app-name">${a.title}</span>
      <span class="app-tag">${a.tag}</span>
    </a>`).join("");
  document.getElementById("empty").classList.toggle("hide", APPS.length > 0);

  function route() {
    const id = location.hash.replace("#", "");
    const app = APPS.find(a => a.id === id);
    if (app) {
      if (frame.dataset.current !== app.id) { frame.src = app.file; frame.dataset.current = app.id; }
      barTitle.textContent = app.title;
      openNew.href = app.file;
      home.classList.add("hide"); view.classList.add("show");
    } else {
      barTitle.textContent = "";
      openNew.removeAttribute("href");
      view.classList.remove("show"); home.classList.remove("hide");
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
